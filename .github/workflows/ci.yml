
name: Python CI + DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install required tools
      - name: Install dependencies
        run: |
          python -m pip install pytest ruff

      # Step 4: Run Python tests
      - name: Run Pytest
        run: python -m pytest -v

      # Step 5: Check code quality
      - name: Run Ruff
        run: ruff check .

      # Step 6: Build Docker image
      - name: Build Docker image
        run: docker build -t python-ci-app:${{ github.sha }} .

      # Step 7: Scan Docker image using Trivy
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: python-ci-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
